name: Bug report
description: wsc or wsc Companion did something wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: wsc
    attributes:
      label: "`wsc --version`"
    validations:
      required: true
  - type: input
    id: ide
    attributes:
      label: WebStorm version and build
      description: Help → About, e.g. "2026.2.3, build 262.10968.77"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: wsc Companion
      description: Installed version, or "not installed"
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: "`wsc-mcp-probe <project dir>` output"
      render: text
    validations:
      required: true
  - type: textarea
    id: dryrun
    attributes:
      label: The command you ran, with `--dry-run` added, and its output
      render: text
