name: release-cli

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release
      id-token: write   # npm trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1. Pinned, not @latest: this job holds id-token: write,
      # so whatever npm release it installs is what publishes. Bump deliberately.
      - run: npm install -g npm@12.1.0
      - run: npm ci

      - id: tag
        run: node scripts/release.js check "$GITHUB_REF_NAME" v "$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: registry
        name: Already on the registry?
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "webstorm-commands@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.registry.outputs.published == 'false'
        run: npm publish --access public ${{ steps.tag.outputs.prerelease == 'true' && '--tag next' || '' }}

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release.js notes cli "$version" > "$RUNNER_TEMP/notes.md"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "wsc $version" --notes-file "$RUNNER_TEMP/notes.md" \
                 ${{ steps.tag.outputs.prerelease == 'true' && '--prerelease' || '' }}
